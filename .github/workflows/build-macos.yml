name: Build macOS Binary

# Triggers (BT-056) — aligné sur le pattern BT-024/BT-055.
# Cf. commentaire top-of-file `build-windows.yml` pour la cause racine
# détaillée : `secrets.GITHUB_TOKEN` natif dans release.yml (commit
# 044d599, 2026-08-12) ne cascade plus vers les workflows aval.
# Fix : `workflow_run: [Release]` + résolution unifiée du tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag vX.Y.Z à builder (optionnel — sinon HEAD current branch)"
        required: false
        type: string
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  build:
    name: Build magma-cycling (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # BT-056 : skip cascade si Release en échec.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write  # release upload asset
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha
                || (github.event_name == 'workflow_dispatch' && inputs.tag && format('refs/tags/{0}', inputs.tag))
                || github.ref }}

      - name: Resolve tag
        id: resolve_tag
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git tag --contains HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          if [ -z "$TAG" ]; then
            echo "::warning::No release tag resolved — build runs but skip asset attach"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Resolved tag $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry and dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Inject version from tag
        if: steps.resolve_tag.outputs.has_tag == 'true'
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed -i '' "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" magma_cycling/__init__.py
          echo "Injected version $VERSION"

      - name: Build binary
        run: poetry run pyinstaller packaging/magma-cycling.spec --distpath dist/

      - name: Verify binary exists
        run: ls -la dist/

      - name: "Smoke test: --version"
        run: dist/magma-cycling --version

      - name: "Smoke test: mcp-server (timeout 5s)"
        env:
          # Skip the data-repo startup health-check on the CI runner — it has
          # no ~/training-logs/workouts-history.md, so the check would
          # sys.exit(1) and the smoke test would falsely fail. Production
          # deployments must NOT set this variable.
          MCP_SKIP_STARTUP_HEALTH_CHECK: "1"
        run: |
          dist/magma-cycling mcp-server &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            kill $PID
            echo "MCP server started successfully (killed after 5s)"
          else
            wait $PID
            EXIT_CODE=$?
            echo "Process exited with code $EXIT_CODE"
            if [ $EXIT_CODE -ne 0 ]; then exit 1; fi
          fi

      - name: Rename with version
        if: steps.resolve_tag.outputs.has_tag == 'true'
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          mv dist/magma-cycling "dist/magma-cycling-${VERSION}-macos-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magma-cycling-macos-${{ matrix.arch }}
          path: dist/magma-cycling*
          retention-days: 30

      - name: Attach to release
        if: steps.resolve_tag.outputs.has_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          gh release upload "$VERSION" "dist/magma-cycling-${VERSION}-macos-${{ matrix.arch }}" --clobber
