name: Build macOS App Bundle

# Triggers (BT-056) — aligné sur le pattern BT-024/BT-055.
# Cf. commentaire top-of-file `build-windows.yml` pour la cause racine
# détaillée : `secrets.GITHUB_TOKEN` natif dans release.yml (commit
# 044d599, 2026-08-12) ne cascade plus vers les workflows aval.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag vX.Y.Z à builder (optionnel — sinon HEAD current branch)"
        required: false
        type: string
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  build:
    name: Build MagmaCycling.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # BT-056 : skip cascade si Release en échec.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha
                || (github.event_name == 'workflow_dispatch' && inputs.tag && format('refs/tags/{0}', inputs.tag))
                || github.ref }}

      - name: Resolve tag
        id: resolve_tag
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(git tag --contains HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          fi
          if [ -z "$TAG" ]; then
            echo "::warning::No release tag resolved — build runs but skip asset attach"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Resolved tag $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Swift package
        working-directory: packaging/MagmaCycling
        run: swift build -c release

      - name: Create .app bundle
        run: |
          APP="MagmaCycling.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          # Copier le binaire
          cp packaging/MagmaCycling/.build/release/MagmaCycling "$APP/Contents/MacOS/"

          # Copier l'icone (referencee par CFBundleIconFile=AppIcon dans Info.plist)
          cp packaging/icons/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          # Info.plist
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>Magma Cycling</string>
              <key>CFBundleDisplayName</key>
              <string>Magma Cycling</string>
              <key>CFBundleIdentifier</key>
              <string>eu.alliancejr.magma-cycling</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleExecutable</key>
              <string>MagmaCycling</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
          </dict>
          </plist>
          PLIST

      - name: Inject version
        if: steps.resolve_tag.outputs.has_tag == 'true'
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" MagmaCycling.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" MagmaCycling.app/Contents/Info.plist

      - name: Re-codesign ad-hoc (required after bundle modifications)
        run: |
          codesign --force --deep --sign - MagmaCycling.app
          codesign --verify --deep --strict MagmaCycling.app

      - name: Smoke test
        run: |
          # Verifier que le binaire demarre (menu bar app, kill apres 3s)
          MagmaCycling.app/Contents/MacOS/MagmaCycling &
          PID=$!
          sleep 3
          if kill -0 $PID 2>/dev/null; then
            kill $PID
            echo "App started successfully"
          fi

      - name: Create DMG
        run: |
          hdiutil create -volname "Magma Cycling" \
            -srcfolder MagmaCycling.app \
            -ov -format UDZO \
            "MagmaCycling-macos-${{ matrix.arch }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagmaCycling-macos-${{ matrix.arch }}
          path: "*.dmg"
          retention-days: 30

      - name: Attach to release
        if: steps.resolve_tag.outputs.has_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.resolve_tag.outputs.tag }}"
          gh release upload "$VERSION" "MagmaCycling-macos-${{ matrix.arch }}.dmg" --clobber
