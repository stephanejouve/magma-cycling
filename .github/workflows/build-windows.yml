name: Build Windows EXE

# Triggers (BT-055) — aligné sur le pattern éprouvé docker-publish.yml (BT-024)
# après la découverte que `release: types: [published]` ne cascade plus depuis
# que release.yml utilise `secrets.GITHUB_TOKEN` natif (commit 044d599,
# 2026-08-12) : GitHub Actions bloque les cascades déclenchées par le token
# natif pour éviter les boucles. Résultat : 29 releases sans .exe Windows
# entre v3.67.0 et v3.73.0 (6 jours). Fix aligné sur docker-publish qui
# utilise `workflow_run` cascade + résolution tag via HEAD.
#
# - workflow_run : cascade native depuis Release. Résout le tag pointant
#   sur le head_sha du run parent (voir step "Resolve tag").
# - release: types: [published] : conservé en secours si GH_TOKEN un jour
#   rétabli (le trigger natif n'a rien coûté avant, c'est juste devenu no-op).
# - workflow_dispatch : chemin manuel avec input `tag` optionnel pour rebuild
#   ciblé (ex. combler un trou historique).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag vX.Y.Z à builder (optionnel — sinon HEAD current branch)"
        required: false
        type: string
  release:
    types: [published]
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  build:
    name: Build magma-cycling.exe
    runs-on: windows-latest
    # BT-055 : skip si cascade workflow_run et Release en échec. Sur push tag
    # / release / workflow_dispatch, exécution inconditionnelle (legacy).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write  # release upload asset
      actions: read

    steps:
      # BT-055 cascade : sur trigger workflow_run, github.ref pointe sur
      # refs/heads/main (le workflow parent Release s'exécute sur main),
      # pas sur le tag qu'il vient de créer. Il faut checkout le head_sha
      # exact du run parent. Sur release / dispatch avec tag, checkout du tag.
      # fetch-depth=0 obligatoire pour `git tag --contains HEAD` dans la step
      # suivante.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha
                || (github.event_name == 'workflow_dispatch' && inputs.tag && format('refs/tags/{0}', inputs.tag))
                || github.ref }}

      # BT-055 : résolution unifiée du tag quel que soit le trigger.
      # Priorité : release.event > dispatch.input > tag pointant sur HEAD.
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "source=release-event"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            echo "source=workflow_dispatch-input"
          else
            # workflow_run cascade OR workflow_dispatch without input : résoudre depuis HEAD
            TAG=$(git tag --contains HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            echo "source=head-lookup"
          fi
          if [ -z "$TAG" ]; then
            echo "::warning::No release tag resolved — build runs but skip asset attach"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Resolved tag $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry and dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-ansi

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Inject version from tag
        if: steps.resolve_tag.outputs.has_tag == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.resolve_tag.outputs.tag }}".TrimStart("v")
          (Get-Content magma_cycling/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$version`"" | Set-Content magma_cycling/__init__.py
          Write-Host "Injected version $version"

      - name: Build executable
        env:
          PYTHONUTF8: "1"
        run: poetry run pyinstaller packaging/magma-cycling.spec --distpath dist/

      - name: Verify executable exists
        run: dir dist\

      - name: "Smoke test: --version"
        run: dist\magma-cycling.exe --version

      - name: "Smoke test: mcp-server (timeout 5s)"
        shell: pwsh
        env:
          # Skip the data-repo startup health-check on the CI runner — it has
          # no ~/training-logs/workouts-history.md, so the check would
          # sys.exit(1) and the smoke test would falsely fail. Production
          # deployments must NOT set this variable.
          MCP_SKIP_STARTUP_HEALTH_CHECK: "1"
        run: |
          $proc = Start-Process -FilePath "dist\magma-cycling.exe" -ArgumentList "mcp-server" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if (!$proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "MCP server started successfully (killed after 5s)"
          } else {
            Write-Host "Process exited with code $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) { exit 1 }
          }

      - name: Rename with version
        if: steps.resolve_tag.outputs.has_tag == 'true'
        run: |
          $version = "${{ steps.resolve_tag.outputs.tag }}"
          Rename-Item dist\magma-cycling.exe "magma-cycling-${version}-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magma-cycling-windows
          path: dist/magma-cycling*.exe
          retention-days: 30

      # BT-055 : passage à GITHUB_TOKEN natif (aligné avec la décision
      # release.yml BT-022). Pour un upload de release asset dans le même
      # repo, le token natif suffit. Fin de la dépendance au PAT expirable.
      - name: Attach to release
        if: steps.resolve_tag.outputs.has_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.resolve_tag.outputs.tag }}"
          gh release upload $version "dist/magma-cycling-${version}-windows.exe" --clobber
