name: Build and Push Docker Image

# Triggers (BT-024) :
# - push tag "v*"   : voie nominale historique. NB post-BT-022 : les
#   tags poussés par le workflow Release avec le GITHUB_TOKEN natif ne
#   déclenchent PAS ce workflow (protection GitHub anti-boucles). Le
#   trigger reste utile pour un push manuel externe.
# - workflow_run    : cascade native depuis Release. Résout le tag
#   pointant sur le head_sha du run parent (voir step "Resolve tag").
#   Supprime le besoin de dispatch manuel après chaque release.
# - workflow_dispatch : chemin de secours manuel (avec ref=vX.Y.Z pour
#   activer la sync + la garde de version, cf. patch PR #441).
on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # BT-024 : skip nette si cascade workflow_run et Release en échec.
    # Sur push et workflow_dispatch, exécution inconditionnelle (legacy).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      # BT-024 cascade : sur trigger workflow_run, github.ref pointe sur
      # refs/heads/main (le workflow parent Release s'exécute sur main),
      # pas sur le tag qu'il vient de créer. Il faut checkout le head_sha
      # exact du run parent pour retrouver le commit taggé. Sur push tag
      # ou workflow_dispatch, comportement par défaut (github.ref).
      #
      # fetch-depth=0 obligatoire pour que `git tag --contains HEAD`
      # trouve le tag pointant sur le commit dans la step suivante.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # BT-024 cascade : résout le tag vX.Y.Z qui pointe sur le HEAD
      # checkouté. Nécessaire uniquement en mode workflow_run — dans les
      # autres triggers, github.ref porte déjà le tag ou n'en a pas.
      # Sortie tag_ref="refs/tags/vX.Y.Z" ou tag_ref="" si aucun tag.
      # Un run cascade sans tag correspondant est skippé proprement.
      - name: Resolve tag from workflow_run head_sha
        id: resolve_tag
        if: github.event_name == 'workflow_run'
        run: |
          TAG=$(git tag --contains HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$TAG" ]; then
            echo "::warning::No release tag on HEAD ${{ github.event.workflow_run.head_sha }} — build skipped"
            echo "tag_ref=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Resolved tag $TAG for cascade build"
            echo "tag_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      # Closes T-github-utils-version-variables (vault P2). Root cause :
      # release.yml force ``commit: "false"`` pour python-semantic-release
      # (branch protection main bloque le push direct du bot) → le tag
      # ``vX.Y.Z`` pointe sur un commit où pyproject.toml::version et
      # magma_cycling/__init__.py::__version__ sont restés stale. L'image
      # Docker buildée depuis ce commit hérite donc d'un ``__version__``
      # qui ne correspond pas au tag pushé → ``system_info`` retourne une
      # version fausse en runtime (catch Stéphane msg 3424 2026-05-23).
      #
      # Fix : sed les 2 fichiers AVANT ``docker build`` en utilisant le tag
      # name. Git source reste intentionnellement stale (artefact tag-driven
      # ``commit: "false"`` doctrine release Stéphane), seule l'image
      # embarque la version correcte.
      #
      # Actif sur les 3 triggers qui portent un tag :
      # - push tag (nominal historique)
      # - workflow_dispatch avec ref=vX.Y.Z (secours manuel)
      # - workflow_run cascade avec tag résolu depuis workflow_run head_sha
      #
      # Skippé sinon (workflow_dispatch sans ref tag, cascade sans tag) —
      # rien à propager, l'image reste sur ce que dit pyproject à HEAD.
      #
      # Source du TAG_VERSION selon le trigger :
      # - push/workflow_dispatch : GITHUB_REF_NAME = vX.Y.Z
      # - workflow_run           : steps.resolve_tag.outputs.tag_ref =
      #                            refs/tags/vX.Y.Z
      - name: Sync version markers from git tag
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG_REF="${{ steps.resolve_tag.outputs.tag_ref }}"
            TAG_VERSION="${TAG_REF#refs/tags/v}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Propagating tag version $TAG_VERSION to pyproject.toml + magma_cycling/__init__.py"
          sed -i "s/^version = \".*\"/version = \"$TAG_VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$TAG_VERSION\"/" magma_cycling/__init__.py
          echo "--- pyproject.toml after sync ---"
          grep "^version = " pyproject.toml
          echo "--- magma_cycling/__init__.py after sync ---"
          grep "^__version__ = " magma_cycling/__init__.py

      # BT-024 garde : assert que le sync s'est bien appliqué avant docker
      # build. Ce qui a cassé une fois sans bruit doit devenir bruyant :
      # sur v3.67.0 le sync avait été skippé (dispatch manuel sur un
      # workflow antérieur au patch PR #441) et l'image avait embarqué
      # __version__ = 3.43.1 stale, découvert par hasard côté prod.
      # Cette assertion catch tout futur trou de gate ou de sync, quel que
      # soit le trigger, en faisant échouer le build explicitement.
      #
      # Critères Coach AI :
      # (a) system-info renvoie le tag après release → garanti côté image.
      # (b) un build volontairement désynchronisé échoue explicitement.
      - name: Assert version markers match tag (BT-024)
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG_REF="${{ steps.resolve_tag.outputs.tag_ref }}"
            TAG_VERSION="${TAG_REF#refs/tags/v}"
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          RUNTIME_VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' magma_cycling/__init__.py)
          if [ "$TAG_VERSION" != "$RUNTIME_VERSION" ]; then
            echo "::error::Version marker mismatch — tag=$TAG_VERSION runtime __version__=$RUNTIME_VERSION"
            echo "The 'Sync version markers' step did not propagate the tag correctly (skipped gate,"
            echo "regex miss, or manual desync). Docker build aborted to prevent shipping a stale label."
            exit 1
          fi
          echo "✅ version markers match tag ($TAG_VERSION)"

      # BT-058 (2026-08-18, spec Coach AI DE-002 D1) : snapshot du contrat
      # MCP courant (schémas + docstrings introspection). Attaché à la
      # release comme asset ``magma-cycling-schemas-vX.Y.Z.json``. Alimente
      # le futur tool ``get-release-notes(from, to)`` pour diff structurel
      # + sémantique rétrospectif.
      #
      # Motif de la garde dure (échec = build échoue) : chaque release sans
      # snapshot = point de diff perdu DÉFINITIVEMENT. Backfill impossible
      # (on ne peut pas reconstruire le schéma d'une version déjà déployée).
      # Coach AI 2026-08-18 : « l'irrattrapabilité justifie la garde dure ».
      # Même pattern qu'assert version markers ci-dessus (BT-024).
      - name: Set up Python 3.12 for schema snapshot
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry for schema snapshot
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        run: pip install poetry

      - name: Install project dependencies for schema snapshot
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        run: poetry install --no-interaction --no-ansi

      - name: Generate MCP schema snapshot (BT-058)
        id: snapshot
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG_REF="${{ steps.resolve_tag.outputs.tag_ref }}"
            TAG_VERSION="${TAG_REF#refs/tags/}"
          else
            TAG_VERSION="${GITHUB_REF_NAME}"
          fi
          mkdir -p snapshot-out
          SNAPSHOT_FILE="snapshot-out/magma-cycling-schemas-${TAG_VERSION}.json"
          echo "Generating schema snapshot → $SNAPSHOT_FILE"
          poetry run python -m magma_cycling.scripts.dump_mcp_schemas > "$SNAPSHOT_FILE"
          ls -la snapshot-out/
          echo "snapshot_file=$SNAPSHOT_FILE" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # BT-058 garde : assert que le snapshot existe, est non-vide et
      # décrit la bonne version. Aligne le comportement sur "Assert version
      # markers match tag (BT-024)" — un stub silencieux doit devenir bruyant.
      - name: Assert schema snapshot exists and matches tag (BT-058 garde)
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        run: |
          SNAPSHOT_FILE="${{ steps.snapshot.outputs.snapshot_file }}"
          TAG_VERSION="${{ steps.snapshot.outputs.tag_version }}"
          if [ ! -s "$SNAPSHOT_FILE" ]; then
            echo "::error::Schema snapshot missing or empty: $SNAPSHOT_FILE"
            echo "The 'Generate MCP schema snapshot' step did not produce a valid file."
            echo "This point of diff is IRRECOVERABLE — Docker build aborted."
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(open('$SNAPSHOT_FILE'))
          assert d.get('version') == '$TAG_VERSION', f'snapshot version={d.get(\"version\")!r} != tag=$TAG_VERSION'
          assert d.get('tool_count', 0) > 0, f'empty tool list: {d}'
          assert len(d.get('tools', [])) == d['tool_count'], f'tool_count/tools mismatch'
          print(f'✅ schema snapshot OK: {d[\"tool_count\"]} tools, version={d[\"version\"]}')
          "

      - name: Attach schema snapshot to release (BT-058)
        if: |
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_run' && steps.resolve_tag.outputs.tag_ref != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAPSHOT_FILE="${{ steps.snapshot.outputs.snapshot_file }}"
          TAG_VERSION="${{ steps.snapshot.outputs.tag_version }}"
          echo "Attaching $SNAPSHOT_FILE to release $TAG_VERSION"
          gh release upload "$TAG_VERSION" "$SNAPSHOT_FILE" --clobber -R ${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # BT-024 post-mortem preprod v3.69.1 (12/08) : sur trigger
          # workflow_run, github.ref = refs/heads/main (le workflow parent
          # Release tourne sur main, pas sur le tag créé). Le pattern
          # ``type=semver`` matche uniquement refs/tags/v* → skip → seul
          # ``latest`` sort → label OCI ``org.opencontainers.image.version``
          # = "latest" au lieu de "3.69.1". Runtime __version__ correct
          # (grâce à Sync + Assert BT-024), mais label cosmétique stale.
          #
          # Fix : ``context: git`` fait dériver les tags depuis
          # ``git describe --tags`` sur le checkout (= head_sha en cascade,
          # qui pointe le commit taggé). Marche identiquement sur push tag
          # et workflow_dispatch (comportement legacy inchangé).
          context: git
          # Ceinture-bretelles cascade workflow_run : docker/metadata-action
          # dérive les tags via git describe en context:git, mais le pattern
          # semver peut ne pas matcher si le HEAD checkouté (head_sha du run
          # parent) est aussi le tip d'une branche (cas où le release commit
          # est le dernier de main). Résultat observé sur v3.69.1 (Admin
          # msg 12/08 22:49) : seul :latest publié, pas :3.69.1, retag
          # :stable source_tag=3.69.1 échoue "not found".
          # Le type=raw ci-dessous force explicitement le tag versionné
          # quand resolve_tag a trouvé une version. No-op sur push tag et
          # workflow_dispatch (resolve_tag est gated sur workflow_run).
          #
          # BT-028 (2026-08-15) : symétriquement, :latest était stale sur
          # cascade workflow_run (Admin msg id=4827, post-v3.70.0). Root
          # cause : condition ``enable={{is_default_branch}}`` de la ligne
          # :latest ne matche pas quand context:git est actif en cascade
          # (l'action lit git describe au lieu de github.ref pour dériver
          # la default branch, et le comportement diverge). Impact : preprod
          # compose sur :latest tirait toujours la vieille version → Admin
          # devait patcher docker-compose.preprod.yml sur :X.Y.Z explicite
          # après chaque release. Fix : ligne raw parallèle à la ceinture
          # versioned, force :latest quand cascade + resolve_tag OK.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.resolve_tag.outputs.version }},enable=${{ github.event_name == 'workflow_run' && steps.resolve_tag.outputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' && steps.resolve_tag.outputs.version != '' }}

      # Deploy key SSH read-only pour cloner outillages (repo privé), dep
      # transitive de magma-cycling-tools v0.2.0 — cf. Dockerfile commentaire
      # "RUN --mount=type=secret,id=outillages_deploy_key".
      #
      # Pattern base64 (workaround multilignes GHA secret) : après les
      # 2 fails consécutifs des runs v3.34.0 + v3.34.1 avec
      # `Load key "/run/secrets/key": error in libcrypto`, le constat est
      # que GHA expose mal une privkey OpenSSH multilignes via
      # `${{ secrets.X }}` (un quelconque étage de la chaîne storage→runtime
      # introduit du mangling). Workaround robuste : Admin re-poste la
      # privkey en base64 single-line (zéro newline → zéro mangling
      # possible) sous un nouveau secret `OUTILLAGES_DEPLOY_KEY_B64`, et
      # le workflow décode au moment d'écrire le fichier.
      # Cf. msg admin id≈2243 (déploiement nocturne 2026-05-09).
      #
      # Garde-fou sécu : mktemp -d 700 (défense en profondeur sur runner
      # éphémère) + install -m 600 garantit fichier en mode safe avant écriture
      # (évite race condition vs chmod après).
      - name: Write outillages deploy key for build
        id: deploy_key
        env:
          OUTILLAGES_DEPLOY_KEY_B64: ${{ secrets.OUTILLAGES_DEPLOY_KEY_B64 }}
        run: |
          KEY_DIR="$(mktemp -d)"
          KEY_PATH="$KEY_DIR/outillages-deploy-key"
          install -m 600 /dev/null "$KEY_PATH"
          printf '%s' "$OUTILLAGES_DEPLOY_KEY_B64" | base64 -d > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"
          echo "key_dir=$KEY_DIR" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BT-025 post-mortem : cache-to gha a floppé 3× sur 4h le 12/08
          # (v3.68.0 cascade + dispatch + v3.69.0 cascade), "failed to
          # reserve cache" au step exporting to GitHub Actions Cache. Le
          # build lui-même complète (layers push OK, manifest OK), c'est
          # UNIQUEMENT le cache export qui foire → job cancelled.
          # Diag : quota 10GB par repo GHA Cache atteint, OU flake backend
          # GitHub. 3/3 aujourd'hui = ne peut plus être toléré comme flake.
          # Fix : passer sur registry cache — stocké dans GHCR sous un tag
          # dédié :buildcache, illimité, robuste, recommandé Docker pour
          # les builds multi-arch (linux/amd64 + linux/arm64). Tag cosmétique
          # à côté des tags versionnés, écrasé à chaque build, consommateurs
          # prod l'ignorent (ils tirent :vX.Y.Z ou :stable).
          cache-from: type=registry,ref=ghcr.io/stephanejouve/magma-cycling:buildcache
          cache-to: type=registry,ref=ghcr.io/stephanejouve/magma-cycling:buildcache,mode=max
          # `secret-files:` (pas `secrets:`) = passer le **contenu** d'un
          # fichier comme valeur du secret BuildKit. Avec `secrets:` la
          # syntaxe `key=value` traite la valeur comme **literal string** —
          # donc le `/tmp/tmp.XXX/outillages-deploy-key` arrivait dans
          # `/run/secrets/key` côté Dockerfile mount comme une string brute
          # ("/tmp/tmp.X3kF9Y/outillages-deploy-key"), pas comme la privkey
          # OpenSSH. ssh -i tentait de parser la string-path → `Load key:
          # error in libcrypto`. C'est ce qui a fait fail 3 builds
          # consécutifs (v3.34.0, v3.34.1, workflow_dispatch 25610786404),
          # même après le workaround base64. Cf. docker/build-push-action@v6
          # action.yml :
          #   secrets:      "List of secrets to expose ... key=string"
          #   secret-files: "List of secret files to expose ... key=filename"
          secret-files: |
            outillages_deploy_key=${{ steps.deploy_key.outputs.key_path }}

      # NB sécu (admin advice msg id=2216 point 2) : la privkey ne doit
      # jamais apparaître dans une layer de l'image. Le pattern Dockerfile
      # `RUN --mount=type=secret` garantit que le secret reste tmpfs et
      # n'est jamais layered (BuildKit gère ça). Vérification ad-hoc
      # impractical en CI multi-arch (build-push-action ne load pas
      # localement après push). Pour audit manuel post-déploiement :
      #   docker pull <image>
      #   docker history --no-trunc <image> | grep -i "PRIVATE KEY"
      #   docker run --rm <image> sh -c 'find / -name "id_*" -o -name "*.priv" 2>/dev/null'
      # Doit retourner vide.

      # Cleanup defensive — secret tmpfs est déjà nettoyé par GHA runner à
      # destruction du job, mais shred explicite limite la fenêtre où une
      # étape suivante pourrait y accéder par erreur.
      - name: Cleanup outillages deploy key
        if: always()
        run: |
          if [ -n "${{ steps.deploy_key.outputs.key_path }}" ]; then
            shred -u "${{ steps.deploy_key.outputs.key_path }}" 2>/dev/null || true
            rm -rf "${{ steps.deploy_key.outputs.key_dir }}" 2>/dev/null || true
          fi
